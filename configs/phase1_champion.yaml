# channel-primary ViT minimal — channel attention (CIFAR-10)
#
# Phase-1 search: channel attention as the central idea; stay within ~5–6M params & ~3–4 GFLOPs
# (verify with: python tools/compute_flops_ptflops.py --repo . --yaml <this-file>).
# 100-epoch runs by default; see program.md for W&B, git push, and later ImageNet scale-up.
#
# Starting point: channels as tokens (spatial axis as features), dim swap in backbone,
# no MLP, no tail, GAP → linear head. MODEL.TYPE cls_cvt.

DATA:
  DATASET: cifar10
  IMG_SIZE: 224

MODEL:
  TYPE: cls_cvt
  NAME: cpvit_minimal_cifar10
  NUM_CLASSES: 10
  DROP_RATE: 0.0
  DROP_PATH_RATE: 0.1

  SPEC:
    INIT: trunc_norm
    NUM_STAGES: 3
    PATCH_SIZE:   [7, 3, 3]
    PATCH_STRIDE: [4, 2, 2]
    PATCH_PADDING: [2, 1, 1]
    DIM_EMBED: [64, 192, 384]
    NUM_HEADS: [1, 1, 1]
    SA_TAIL_DEPTH: [0, 0, 0]
    SA_TAIL_NUM_HEADS: [0, 0, 0]
    TAIL_TYPE: 'sa'
    DEPTH: [1, 2, 10]
    PATCH_EMBED_METHOD: ['dw_sep', 'dw_only', 'dw_only']
    MLP_RATIO: [0, 0, 0]
    CA_MLP_RATIO: [0, 0, 0]
    TAIL_MLP_RATIO: [4.0, 4.0, 4.0]
    ATTN_DROP_RATE: [0.0, 0.0, 0.0]
    DROP_RATE: [0.0, 0.0, 0.0]
    DROP_PATH_RATE: [0.0, 0.0, 0.1]
    QKV_BIAS: [True, True, True]
    CLS_TOKEN: [False, False, False]
    POS_EMBED: [False, False, False]
    QKV_PROJ_METHOD: ['dw_bn', 'dw_bn', 'dw_bn']
    KERNEL_QKV: [3, 3, 3]
    PADDING_KV: [1, 1, 1]
    STRIDE_KV: [1, 1, 1]
    PADDING_Q: [1, 1, 1]
    STRIDE_Q: [1, 1, 1]
    DW_SHORTCUT_BACKBONE: false
    DW_SHORTCUT_TAIL: false

TRAIN:
  EPOCHS: 100
  WARMUP_EPOCHS: 10
  BASE_LR: 5e-4
  WARMUP_LR: 5e-7
  MIN_LR: 5e-6
